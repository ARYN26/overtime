<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — OVERTIME</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="stylesheet" href="css/styles.css?v=9">
</head>
<body>

  <header class="nav">
    <div class="nav-inner">
      <a class="nav-logo" href="index.html">OVER<span class="bolt">T</span>IME</a>
      <button class="nav-toggle" aria-label="Menu">☰</button>
      <ul class="nav-links">
        <li><a href="how-to-apply.html">How to Apply</a></li>
        <li><a href="science.html">Science</a></li>
        <li><a href="faq.html">FAQ</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="login.html" class="active">Login</a></li>
        <li><a class="btn btn-blue" href="shop.html">Shop</a></li>
      </ul>
    </div>
  </header>

  <div class="auth-wrap" style="background-image: url('assets/img/real/banner.png');">
    <div class="auth-card">
      <h2 style="text-align:center;font-size:1.5rem;">Welcome back</h2>
      <div class="auth-tabs">
        <button class="auth-tab active" data-mode="login" type="button">Log in</button>
        <button class="auth-tab" data-mode="signup" type="button">Sign up</button>
      </div>
      <form id="auth-form">
        <div class="field" id="name-field" style="display:none;">
          <label for="name">Name</label>
          <input type="text" id="name" placeholder="Your name" autocomplete="name">
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@email.com" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <button class="btn btn-blue" type="submit">Log in</button>
      </form>
      <p class="auth-note">By continuing you agree to our terms. New here? Hit <strong>Sign up</strong> — there's something in it for you.</p>
    </div>
  </div>

  <!-- First-time signup discount modal -->
  <div class="modal-overlay" id="discount-modal">
    <div class="modal">
      <button class="modal-close" aria-label="Close">✕</button>
      <h3>Welcome to the team</h3>
      <div class="discount">10% OFF</div>
      <p style="color:var(--text-dim);max-width:none;">Your first order, on us to start. Use this code at checkout:</p>
      <div class="code">OT10</div><br>
      <a class="btn btn-blue" href="shop.html">Claim &amp; Shop</a>
    </div>
  </div>

  <script src="js/main.js?v=7"></script>
</body>
</html>
